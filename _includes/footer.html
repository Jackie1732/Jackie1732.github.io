<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-motto">{{ site.motto }}</p>
    <p class="footer-copy">&copy; {{ site.year }}&ndash;{{ 'now' | date: "%Y" }} <a href="{{ site.author.url }}">{{ site.owner }}</a> <span class="footer-sep" aria-hidden="true">·</span> <a href="{{ '/atom.xml' | relative_url }}">RSS</a> <span class="footer-sep" aria-hidden="true">·</span> <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a></p>
  </div>
</footer>

<script>
// Mobile menu toggle
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.querySelector('.menu-toggle');
  var nav = document.querySelector('.site-nav');
  if (!toggle || !nav) return;

  function setMenu(open) {
    nav.classList.toggle('open', open);
    toggle.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? '收起主导航' : '展开主导航');
  }

  toggle.addEventListener('click', function() {
    setMenu(!nav.classList.contains('open'));
  });

  nav.addEventListener('click', function(event) {
    if (event.target.closest('a')) setMenu(false);
  });

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && nav.classList.contains('open')) {
      setMenu(false);
      toggle.focus();
    }
  });
});
</script>
