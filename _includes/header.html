<header class="site-header">
  <div class="header-inner">
    <a href="{{ "/" | prepend: site.baseurl | replace: '//', '/' }}" class="site-title">
      <span class="logo-icon">&#62;_</span> {{ site.title }}
    </a>
    <button class="menu-toggle" type="button" aria-label="展开主导航" aria-controls="primary-navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav id="primary-navigation" class="site-nav" aria-label="主导航">
      <a href="{{ "/" | prepend: site.baseurl | replace: '//', '/' }}" class="nav-link {% if page.url == '/' %}active{% endif %}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
      <a href="{{ "/research/" | prepend: site.baseurl | replace: '//', '/' }}" class="nav-link {% if page.url contains '/research/' %}active{% endif %}"{% if page.url contains '/research/' %} aria-current="page"{% endif %}>AI/LLM 笔记</a>
      <a href="{{ "/archive" | prepend: site.baseurl | replace: '//', '/' }}" class="nav-link {% if page.url == '/archive' %}active{% endif %}"{% if page.url == '/archive' %} aria-current="page"{% endif %}>安全文章</a>
      <a href="{{ "/tags" | prepend: site.baseurl | replace: '//', '/' }}" class="nav-link {% if page.url == '/tags' %}active{% endif %}"{% if page.url == '/tags' %} aria-current="page"{% endif %}>主题导航</a>
      <a href="{{ "/about" | prepend: site.baseurl | replace: '//', '/' }}" class="nav-link {% if page.url == '/about' %}active{% endif %}"{% if page.url == '/about' %} aria-current="page"{% endif %}>关于</a>
      <a href="https://github.com/{{ site.github_username }}" class="nav-link" target="_blank" rel="noopener" aria-label="在 GitHub 打开 {{ site.owner }} 的主页（新窗口）">
        <svg class="nav-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
      </a>
    </nav>
  </div>
</header>
