<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="generator" content="Jekyll">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">

  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl | replace: '//', '/' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <script>document.documentElement.classList.add('js');</script>

  <link href="{{ '/atom.xml' | relative_url }}" type="application/rss+xml" rel="alternate" title="RSS Feed" />
  {% if page.article_tools %}
  <script defer src="{{ '/assets/js/article-enhancements.js' | relative_url }}"></script>
  {% endif %}
  {% if page.math %}
  <script>
    window.MathJax = {
      loader: {
        load: ['[tex]/mhchem', '[tex]/mathtools', '[tex]/physics', '[tex]/tagformat']
      },
      tex: {
        tags: 'ams',
        inlineMath: { '[+]': [['$', '$']] },
        displayMath: { '[+]': [['$$', '$$']] },
        processEscapes: true,
        packages: { '[+]': ['mhchem', 'mathtools', 'physics', 'tagformat'] }
      },
      options: {
        ignoreHtmlClass: 'no-mathjax'
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"></script>
  {% endif %}
  {% if page.mermaid %}
  <script type="module" src="{{ '/assets/js/mermaid-loader.js' | relative_url }}"></script>
  {% endif %}
  {% seo %}
</head>
