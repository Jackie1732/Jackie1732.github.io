    class: "tag-htb"
  春秋云:
    label: "春秋云境"
    class: "tag-chunqiu"
  玄机:
    label: "玄机"
    class: "tag-xuanji"
  域渗透:
    label: "域渗透"
    class: "tag-ad"
  Active_Directory:
    label: "域渗透"
    class: "tag-ad"
  ADCS:
    label: "域渗透"
    class: "tag-ad"
  Go:
    label: "Go"
    class: "tag-go"
  Java:
    label: "Java"
    class: "tag-java"
  开发:
    label: "开发"
    class: "tag-dev"
  CTF:
    label: "CTF"
    class: "tag-ctf"
  deep-learning:
    label: "深度学习"
    class: "tag-deep-learning"
  llm:
    label: "LLM"
    class: "tag-llm"
  transformers:
    label: "Transformer"
    class: "tag-transformers"
  pytorch:
    label: "PyTorch"
    class: "tag-pytorch"
  d2l:
    label: "D2L"
    class: "tag-d2l"
  mathematics:
    label: "数学基础"
    class: "tag-mathematics"
  papers:
    label: "论文阅读"
    class: "tag-papers"
  rag:
