title: GAiLO-Blog
description: "A Jekyll Blog Theme For Hackers"
author:
  name: "GAiLO"
  email: "ga1lo@qq.com"
  url: "https://Jackie1732.github.io/"

baseurl: /

source: .
destination: ./_site
permalink: /:title
paginate: 10
paginate_path: /page/:num/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

# Custom variables
owner : "GAiLO"
year : "2025"
