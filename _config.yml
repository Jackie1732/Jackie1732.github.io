title: GAiLO-Blog
description: "我整理安全、深度学习和 LLM 学习过程的地方。"
url: "https://jackie1732.github.io"
author:
  name: "GAiLO"
  email: "ga1lo@qq.com"
  url: "https://Jackie1732.github.io/"

baseurl: /

source: .
destination: ./_site
permalink: /:title
paginate: 12
paginate_path: /page/:num/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      article_tools: true
  -
    scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
      section: "ai"
      toc: true
      article_tools: true

collections:
  notes:
    output: true
    permalink: /notes/:path/

exclude:
  - templates
  # Personal repository notes; not a public Jekyll page.
  - Usage.md

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-scholar

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  hard_wrap: false
  parse_block_html: true
  parse_span_html: true
  header_offset: 0
  smart_quotes: [apos, apos, quot, quot]
  syntax_highlighter_opts:
    default_lang: text

# BibTeX-based references for paper notes and experiment reports. Individual
# pages opt in to an automatically generated bibliography with
# `bibliography: true` in front matter.
scholar:
  source: ./_bibliography
  bibliography: references.bib
  style: china-national-standard-gb-t-7714-2015-numeric
  locale: zh-CN
  sort_by: none
  order: ascending
  bibliography_template: bibliography_item
  separate_links: false
  bibliography_item_attributes:
    class: reference-item

# Custom variables
owner: "GAiLO"
year: "2025"
github_username: Jackie1732
repository: "Jackie1732/Jackie1732.github.io"
motto: "边学边做，随手记下。"

