title: GAiLO-Blog
description: "公开记录安全研究、深度学习与 LLM 系统实践：可检索、可复现、持续修订。"
url: "https://jackie1732.github.io"
author:
  name: "GAiLO"
  email: "ga1lo@qq.com"
  url: "https://Jackie1732.github.io/"

baseurl: /

source: .
destination: ./_site
permalink: /:title
paginate: 12
paginate_path: /page/:num/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
      section: "ai"
      toc: true

collections:
  notes:
    output: true
    permalink: /notes/:path/

exclude:
  - templates
  # Personal repository notes; not a public Jekyll page.
  - Usage.md

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  hard_wrap: false
  parse_block_html: true
  parse_span_html: true
  header_offset: 0
  smart_quotes: [apos, apos, quot, quot]
  syntax_highlighter_opts:
    default_lang: text

# Custom variables
owner: "GAiLO"
year: "2025"
github_username: Jackie1732
repository: "Jackie1732/Jackie1732.github.io"
motto: "公开学习，谨慎验证。"

