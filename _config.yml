title: GAiLO-Blog
description: "Security Research & Development Notes"
author:
  name: "GAiLO"
  email: "ga1lo@qq.com"
  url: "https://Jackie1732.github.io/"

baseurl: /

source: .
destination: ./_site
permalink: /:title
paginate: 12
paginate_path: /page/:num/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  hard_wrap: false
  parse_block_html: true
  parse_span_html: true
  header_offset: 0
  smart_quotes: [apos, apos, quot, quot]
  syntax_highlighter_opts:
    default_lang: text

# Custom variables
owner: "GAiLO"
year: "2025"
github_username: Jackie1732
motto: "Looking for light."

# Tag display configuration (label / css-class)
tag_map:
  HTB:
    label: "HackTheBox"
    class: "tag-htb"
  春秋云:
    label: "春秋云境"
    class: "tag-chunqiu"
  玄机:
    label: "玄机"
    class: "tag-xuanji"
  域渗透:
    label: "域渗透"
    class: "tag-ad"
  Active_Directory:
    label: "域渗透"
    class: "tag-ad"
  ADCS:
    label: "域渗透"
    class: "tag-ad"
  Go:
    label: "Go"
    class: "tag-go"
  Java:
    label: "Java"
    class: "tag-java"
  开发:
    label: "开发"
    class: "tag-dev"
  CTF:
    label: "CTF"
    class: "tag-ctf"

# Difficulty levels
difficulty_map:
  easy:
    label: "简单"
    class: "diff-easy"
  medium:
    label: "中等"
    class: "diff-medium"
  hard:
    label: "困难"
    class: "diff-hard"
  insane:
    label: "疯狂"
    class: "diff-insane"
