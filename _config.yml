# Controlled learning tracks for the evergreen research-note collection.
note_track_map:
  foundations:
    label: "数学与基础"
    description: "线性代数、概率统计、Python 与 PyTorch 基础。"
    class: "track-foundations"
  deep-learning:
    label: "深度学习"
    description: "D2L、视觉、优化和神经网络训练。"
    class: "track-deep-learning"
  llm:
    label: "大语言模型"
    description: "Transformer、预训练、微调、RAG 与推理系统。"
    class: "track-llm"
  papers:
    label: "论文阅读"
    description: "论文精读、复现与研究问题记录。"
    class: "track-papers"
  experiments:
    label: "实验与项目"
    description: "可复现的实验、评测和项目复盘。"
    class: "track-experiments"

# Public-facing note metadata. Future notes should state both their form and
# the confidence / validation state of the conclusions.
note_type_map:
  study-note:
    label: "学习笔记"
    class: "note-kind-study"
  paper-review:
    label: "论文精读"
    class: "note-kind-paper"
  experiment:
    label: "实验复盘"
    class: "note-kind-experiment"

note_status_map:
  evolving:
    label: "持续修订"
    class: "note-status-evolving"
  verified:
    label: "已验证"
    class: "note-status-verified"

# Difficulty levels
difficulty_map:
  easy:
    label: "简单"
    class: "diff-easy"
  medium:
    label: "中等"
    class: "diff-medium"
  hard:
    label: "困难"
    class: "diff-hard"
  insane:
    label: "疯狂"
    class: "diff-insane"
