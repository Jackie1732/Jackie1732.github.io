<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" role="img" aria-labelledby="title description">
  <title id="title">研究文章的证据链</title>
  <desc id="description">问题、方法、证据与结论四个节点由箭头依次连接。</desc>
  <defs>
    <linearGradient id="fill" x1="0" x2="1">
      <stop offset="0" stop-color="#122333"/>
      <stop offset="1" stop-color="#112a29"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4fd1c5"/>
    </marker>
  </defs>
  <rect width="920" height="210" rx="16" fill="#101720"/>
  <g font-family="Inter, Arial, sans-serif">
    <g fill="url(#fill)" stroke="#344252" stroke-width="2">
      <rect x="30" y="62" width="168" height="86" rx="12"/>
      <rect x="258" y="62" width="168" height="86" rx="12"/>
      <rect x="486" y="62" width="168" height="86" rx="12"/>
      <rect x="714" y="62" width="168" height="86" rx="12"/>
    </g>
    <g stroke="#4fd1c5" stroke-width="3" marker-end="url(#arrow)">
      <path d="M205 105H245"/>
      <path d="M433 105H473"/>
      <path d="M661 105H701"/>
    </g>
    <g fill="#e6edf3" text-anchor="middle">
      <text x="114" y="97" font-size="23" font-weight="700">问题</text>
      <text x="114" y="123" font-size="14" fill="#9aa7b5">边界与假设</text>
      <text x="342" y="97" font-size="23" font-weight="700">方法</text>
      <text x="342" y="123" font-size="14" fill="#9aa7b5">设计与实现</text>
      <text x="570" y="97" font-size="23" font-weight="700">证据</text>
      <text x="570" y="123" font-size="14" fill="#9aa7b5">数据与复现</text>
      <text x="798" y="97" font-size="23" font-weight="700">结论</text>
      <text x="798" y="123" font-size="14" fill="#9aa7b5">适用范围</text>
    </g>
  </g>
</svg>
